<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ماذا فَعَلْتُ اليَوْم؟ - أَلْعاب</title>
    <style>
    h1, h2, h3, h4, h5, h6, strong, b { font-weight: normal !important; }

        @font-face { 
            font-family: 'Arakom'; 
            src: url('arakom.ttf') format('truetype'); 
        }
        
        :root {
            --primary: #2c3e50;
            --secondary: #d35400;
            --accent: #2980b9;
            --text-main: #34495e;
        }

        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }

        /* GÜNLÜK HAYAT KONSEPTİ: Sabah, Öğle ve Akşamüstü Pastel Tonları */
        body {
            font-family: 'Arakom', 'Segoe UI', Tahoma, sans-serif; 
            background-color: #fdfbfb;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(255, 235, 180, 0.8) 0%, transparent 50%), /* Sabah güneşi */
                radial-gradient(circle at 90% 80%, rgba(180, 220, 255, 0.7) 0%, transparent 50%), /* Gündüz mavisi */
                radial-gradient(circle at 80% 20%, rgba(255, 210, 200, 0.7) 0%, transparent 50%), /* Akşamüstü */
                radial-gradient(circle at 20% 90%, rgba(230, 240, 250, 0.8) 0%, transparent 50%); /* Gece/Gri */
            background-attachment: fixed;
            color: var(--text-main); 
            min-height: 100dvh; 
            display: flex;
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 2vh 2vw; /* Boşluklar mobilde daha dar olması için kısıldı */
            overflow-x: hidden; 
            position: relative;
        }

        /* --- ARKA PLAN SAYDAM EMOJİLER (GÜNLÜK HAYAT) --- */
        .floating-emojis {
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100dvh;
            pointer-events: none; 
            z-index: -2;
            overflow: hidden;
        }

        .floating-emojis span {
            position: absolute;
            opacity: 0.25; 
            animation: float ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            100% { transform: translateY(-20px) rotate(10deg) scale(1.05); }
        }

        /* Agresif küçülen saydam emojiler */
        .em-1 { top: 5%; left: 4%; font-size: clamp(2.5rem, 6vw, 5rem); animation-duration: 12s; animation-delay: 0s; } /* Saat/Uyanma */
        .em-2 { top: 8%; right: 5%; font-size: clamp(3rem, 7vw, 6rem); animation-duration: 15s; animation-delay: -2s; } /* Güneş */
        .em-3 { top: 35%; left: 3%; font-size: clamp(2rem, 5vw, 4.5rem); animation-duration: 14s; animation-delay: -5s; } /* Okul/Otobüs */
        .em-4 { top: 40%; right: 3%; font-size: clamp(3.5rem, 8vw, 6.5rem); animation-duration: 18s; animation-delay: -3s; } /* Kahvaltı/Yemek */
        .em-5 { top: 75%; left: 5%; font-size: clamp(3rem, 7vw, 5.5rem); animation-duration: 13s; animation-delay: -7s; } /* Kitap/Ders */
        .em-6 { top: 72%; right: 6%; font-size: clamp(2.5rem, 6vw, 4.5rem); animation-duration: 16s; animation-delay: -1s; } /* Spor/Top */
        .em-7 { top: 18%; left: 15%; font-size: clamp(1.8rem, 4vw, 3.5rem); animation-duration: 11s; animation-delay: -4s; } /* Diş fırçalama/Temizlik */
        .em-8 { top: 22%; right: 12%; font-size: clamp(2rem, 5vw, 4rem); animation-duration: 17s; animation-delay: -6s; } /* Çay/Kahve */
        .em-9 { top: 88%; left: 18%; font-size: clamp(1.8rem, 4vw, 3.5rem); animation-duration: 14s; animation-delay: -2s; } /* TV/Oyun */
        .em-10 { top: 85%; right: 20%; font-size: clamp(2.5rem, 6vw, 5rem); animation-duration: 19s; animation-delay: -8s; } /* Yatak/Uyku */
        .em-11 { top: 4%; left: 28%; font-size: clamp(3rem, 7vw, 5.5rem); animation-duration: 15s; animation-delay: -3s; } /* Ay/Gece */
        .em-12 { top: 5%; right: 30%; font-size: clamp(2rem, 5vw, 4.5rem); animation-duration: 12s; animation-delay: -9s; } /* Duş/Su */

        .main-container {
            width: 100%;
            max-width: 1050px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(15px, 4vh, 45px); /* Mobilde boşluklar daha agresif kısıldı */
            z-index: 10;
        }

        .header { 
            text-align: center; 
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: clamp(15px, 4vw, 35px) clamp(15px, 6vw, 60px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 700px;
            position: relative;
        }

        /* --- BÜYÜTÜLMÜŞ ÜNİTE ROZETİ --- */
        .unit-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--secondary), #e67e22);
            color: white;
            padding: clamp(8px, 2vw, 12px) clamp(20px, 5vw, 40px); /* Daha dolgun */
            border-radius: 30px;
            font-size: clamp(1.4rem, 4vw, 2.2rem); /* Çok daha büyük font */
            font-weight: normal;
            margin-bottom: 35px;
            box-shadow: 0 4px 15px rgba(211, 84, 0, 0.35);
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .header h1 { 
            font-size: clamp(1.8rem, 7vw, 4.5rem); /* Minimum boyut agresif küçültüldü */
            color: var(--primary); 
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .header p { 
            color: var(--text-main); 
            font-size: clamp(0.9rem, 4vw, 1.6rem); 
            opacity: 0.8;
        }

        /* Kartlar İçin Agresif Esnek Izgara */
        .grid-container {
            display: flex;
            flex-wrap: wrap; 
            justify-content: center; 
            align-items: stretch;
            width: 100%;
            gap: clamp(10px, 3vw, 25px); /* Mobilde kartlar arası boşluk kısıldı */
        }

        .game-card {
            position: relative;
            overflow: hidden; 
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 1);
            border-radius: clamp(20px, 4vw, 30px); 
            padding: clamp(10px, 4vw, 25px); /* Mobilde iç boşluklar agresif kısıldı */
            text-align: center;
            text-decoration: none; 
            color: var(--primary); 
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.03);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            flex: 1 1 calc(25% - 25px);
            max-width: 320px;
            min-width: clamp(120px, 22%, 220px); /* 4 kart yan yana sığabilmesi için küçültüldü */
            min-height: clamp(120px, 18vh, 190px);
            z-index: 1;
        }

        .game-card::before {
            content: attr(data-num);
            position: absolute;
            bottom: -5%;
            left: 2%; 
            font-size: clamp(4rem, 12vw, 10rem); /* Dev rakamlar mobilde hızla küçülür */
            font-family: 'Georgia', 'Times New Roman', serif;
            font-style: italic;
            font-weight: 400;
            background: linear-gradient(135deg, rgba(44, 62, 80, 0.08), rgba(44, 62, 80, 0.01));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: -1; 
            line-height: 0.8;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .game-card:hover { 
            transform: translateY(-10px) scale(1.02); 
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 15px 40px rgba(41, 128, 185, 0.15);
            border-color: rgba(41, 128, 185, 0.4);
        }

        .game-card:hover::before {
            transform: translateY(-15px) scale(1.05) rotate(-5deg);
            background: linear-gradient(135deg, rgba(41, 128, 185, 0.2), rgba(41, 128, 185, 0.05));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .icon-circle {
            width: clamp(45px, 10vw, 85px); /* Mobilde ikon kutusu iyice küçülür */
            height: clamp(45px, 10vw, 85px); 
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.5));
            border: 2px solid rgba(255,255,255,1);
            border-radius: clamp(15px, 4vw, 24px); 
            display: flex; 
            align-items: center;
            justify-content: center; 
            margin-bottom: clamp(8px, 2vw, 15px); 
            font-size: clamp(1.6rem, 5vw, 3.2rem); /* İkon boyutu agresif küçülür */
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .game-card:hover .icon-circle {
            transform: scale(1.15) rotate(8deg);
            background: rgba(255, 255, 255, 1);
            border-color: var(--accent);
        }

        .game-card h2 { 
            font-size: clamp(0.95rem, 8vw, 2.5rem); /* Mobilde başlık daha hızlı küçülür */
            font-weight: normal;
            line-height: 1.3;
        }

        /* MOBİL EKRANLAR */
        @media (max-width: 768px) {
            .game-card { 
                flex-basis: calc(50% - 10px);
            }
            .game-card::before {
                bottom: -8%;
            }
        }

        /* ÇOK DAR EKRANLAR (400px altı) */
        @media (max-width: 400px) {
            .game-card {
                flex-basis: 100%;
                max-width: 100%;
                min-height: 80px;
                flex-direction: row; 
                gap: 12px;
                padding: 12px 15px;
                justify-content: flex-start;
                text-align: right;
            }
            .icon-circle {
                margin-bottom: 0;
                flex-shrink: 0;
                width: 45px;
                height: 45px;
                font-size: 1.5rem;
                border-radius: 14px;
            }
            .game-card h2 {
                margin-top: 0;
                font-size: 1rem;
            }
            .game-card::before {
                left: 5%;
                bottom: -25%;
                font-size: 4.5rem;
            }
        }
    
    
        /* ==================================================================
           OZEL KART - CANLI BILGI YARISMASI
           Diger kartlar cam beyazi ve emoji ikonlu; bu kart kasten farkli:
           kendi satirini bastan sona kaplar, koyu mor gradyan zemin ve altin
           cerceve kullanir, ikon yerine animasyonlu SVG kupa tasir.
           Tum animasyonlar salt gorseldir; en altta "hareketi azalt" sistem
           ayari icin kapatma blogu vardir.
           ================================================================== */
        .quiz-card {
            flex: 1 1 100%;
            max-width: 100%;
            min-width: 0;
            min-height: clamp(105px, 19vh, 165px);
            flex-direction: row;
            justify-content: center;
            gap: clamp(12px, 3.5vw, 38px);
            padding: clamp(12px, 3vw, 26px) clamp(16px, 5vw, 46px);
            background: linear-gradient(115deg, #221a4a 0%, #3a2a78 46%, #5c40a8 100%);
            border: 2px solid rgba(255, 214, 120, 0.5);
            box-shadow: 0 14px 40px rgba(50, 35, 110, 0.32);
            color: #fff;
            overflow: hidden;
        }

        /* Dev rakam: beyaz kartlarda gri, burada altin tonunda */
        .quiz-card::before {
            background: linear-gradient(135deg, rgba(255, 215, 120, 0.30), rgba(255, 215, 120, 0.03));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Kartin uzerinden yavasca gecen isik seridi */
        .quiz-card::after {
            content: "";
            position: absolute;
            top: -60%;
            bottom: -60%;
            width: 60px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent);
            transform: rotate(14deg);
            animation: quizSerit 6.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes quizSerit {
            0%        { left: -20%; opacity: 0; }
            12%       { opacity: 1; }
            55%       { opacity: 1; }
            70%, 100% { left: 110%; opacity: 0; }
        }

        .quiz-card:hover {
            background: linear-gradient(115deg, #2a1f5c 0%, #45318d 46%, #6c4cc4 100%);
            border-color: rgba(255, 214, 120, 0.95);
            box-shadow: 0 20px 50px rgba(50, 35, 110, 0.45);
        }

        .quiz-ikon {
            flex-shrink: 0;
            width: clamp(62px, 12vw, 118px);
            height: clamp(62px, 12vw, 118px);
            z-index: 1;
        }
        .quiz-ikon svg { width: 100%; height: 100%; display: block; overflow: visible; }

        .quiz-yazi {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(4px, 1vw, 9px);
            z-index: 1;
        }
        .quiz-card h2 {
            color: #fff;
            font-size: clamp(1.15rem, 4.6vw, 2.6rem);
            line-height: 1.25;
            text-shadow: 0 2px 10px rgba(0,0,0,0.25);
        }
        .quiz-alt {
            font-size: clamp(0.75rem, 2.4vw, 1.15rem);
            color: rgba(255, 231, 178, 0.9);
        }

        /* "Canli" rozeti: kirmizi nokta disa dogru nabiz atar */
        .quiz-rozet {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 214, 120, 0.45);
            border-radius: 999px;
            padding: 3px 14px 4px;
            font-size: clamp(0.7rem, 2.2vw, 1.05rem);
            color: #FFE7B2;
        }
        .quiz-nokta {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #FF5A5A;
            animation: quizNabiz 1.8s ease-out infinite;
        }
        @keyframes quizNabiz {
            0%   { box-shadow: 0 0 0 0 rgba(255, 90, 90, 0.75); }
            70%  { box-shadow: 0 0 0 9px rgba(255, 90, 90, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 90, 90, 0); }
        }

        /* --- SVG kupanin hareketleri --- */
        .q-isinlar { transform-origin: 60px 50px; animation: quizDon 20s linear infinite; }
        @keyframes quizDon { to { transform: rotate(360deg); } }

        .q-hale { animation: quizNefes 3.4s ease-in-out infinite; }
        @keyframes quizNefes { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        .q-kupa { transform-origin: 60px 60px; animation: quizSuzul 3.8s ease-in-out infinite; }
        @keyframes quizSuzul { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .q-parlak { animation: quizGecis 3.2s ease-in-out infinite; }
        @keyframes quizGecis {
            0%        { transform: translateX(-46px); opacity: 0; }
            18%       { opacity: 0.55; }
            58%       { opacity: 0.55; }
            76%, 100% { transform: translateX(64px); opacity: 0; }
        }

        .q-yildiz {
            transform-box: fill-box;
            transform-origin: center;
            animation: quizParla 2.6s ease-in-out infinite;
        }
        .q-y2 { animation-delay: 0.85s; }
        .q-y3 { animation-delay: 1.7s; }
        @keyframes quizParla {
            0%, 100% { opacity: 0;    transform: scale(0.35) rotate(0deg); }
            45%      { opacity: 0.95; transform: scale(1) rotate(30deg); }
        }

        @media (max-width: 400px) {
            .quiz-card {
                justify-content: flex-start;
                text-align: right;
                gap: 12px;
                padding: 12px 15px;
                min-height: 92px;
            }
            .quiz-yazi { align-items: flex-start; }
            .quiz-card h2 { font-size: 1.05rem; }
        }

        /* Kullanici sistem ayarinda hareketi azaltmissa kart sabit dursun */
        @media (prefers-reduced-motion: reduce) {
            .quiz-card::after, .quiz-nokta, .q-isinlar,
            .q-hale, .q-kupa, .q-parlak, .q-yildiz { animation: none; }
            .q-yildiz { opacity: 0.8; transform: none; }
        }

</style>

    

    
</head>

            <!-- Canlı bilgi yarışması (Firebase). Öğretmen odayı kurar, öğrenciler

            <a href="bilgiyarismasivezinler.html" class="game-card quiz-card" data-num="8">

                    <!-- Animasyonlu kupa: arkada donen isinlar, nefes alan hale,

                         sirayla yanip sonen uc yildiz. -->
                    <svg viewBox="0 0 120 120" role="img" aria-label="كَأس">
                        <defs>
                            <linearGradient id="qAltin" x1="0" y1="0" x2="0.3" y2="1">
                                <stop offset="0%"   stop-color="#FFF0C2"/>

                        </g>

                        <g class="q-kupa">
                            <!-- kulplar -->
                            <path d="M40,31 C29,29 24,35 25,42 C26,51 33,56 41,57"
                                  fill="none" stroke="url(#qTaban)" stroke-width="5" stroke-linecap="round"/>
                            <path d="M80,31 C91,29 96,35 95,42 C94,51 87,56 79,57"
                                  fill="none" stroke="url(#qTaban)" stroke-width="5" stroke-linecap="round"/>
                            <!-- kase -->
                            <path d="M40,26 H80 V44 C80,61 72,72 60,72 C48,72 40,61 40,44 Z"
                                  fill="url(#qAltin)"/>
                            <!-- kasenin uzerinden gecen parlaklik (kaseye kirpilmis) -->
                            <g clip-path="url(#qKirp)">
