<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ماذا فَعَلْتُ اليَوْم؟ - أَلْعاب</title>
    <style>
    h1, h2, h3, h4, h5, h6, strong, b { font-weight: normal !important; }

        @font-face { 
            font-family: 'Arakom'; 
            src: url('arakom.ttf') format('truetype'); 
        }
        
        :root {
            --primary: #2c3e50;
            --secondary: #d35400;
            --accent: #2980b9;
            --text-main: #34495e;
        }

        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }

        /* GÜNLÜK HAYAT KONSEPTİ: Sabah, Öğle ve Akşamüstü Pastel Tonları */
        body {
            font-family: 'Arakom', 'Segoe UI', Tahoma, sans-serif; 
            background-color: #fdfbfb;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(255, 235, 180, 0.8) 0%, transparent 50%), /* Sabah güneşi */
                radial-gradient(circle at 90% 80%, rgba(180, 220, 255, 0.7) 0%, transparent 50%), /* Gündüz mavisi */
                radial-gradient(circle at 80% 20%, rgba(255, 210, 200, 0.7) 0%, transparent 50%), /* Akşamüstü */
                radial-gradient(circle at 20% 90%, rgba(230, 240, 250, 0.8) 0%, transparent 50%); /* Gece/Gri */
            background-attachment: fixed;
            color: var(--text-main); 
            min-height: 100dvh; 
            display: flex;
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 2vh 2vw; /* Boşluklar mobilde daha dar olması için kısıldı */
            overflow-x: hidden; 
            position: relative;
        }

        /* --- ARKA PLAN SAYDAM EMOJİLER (GÜNLÜK HAYAT) --- */
        .floating-emojis {
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100dvh;
            pointer-events: none; 
            z-index: -2;
            overflow: hidden;
        }

        .floating-emojis span {
            position: absolute;
            opacity: 0.25; 
            animation: float ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            100% { transform: translateY(-20px) rotate(10deg) scale(1.05); }
        }

        /* Agresif küçülen saydam emojiler */
        .em-1 { top: 5%; left: 4%; font-size: clamp(2.5rem, 6vw, 5rem); animation-duration: 12s; animation-delay: 0s; } /* Saat/Uyanma */
        .em-2 { top: 8%; right: 5%; font-size: clamp(3rem, 7vw, 6rem); animation-duration: 15s; animation-delay: -2s; } /* Güneş */
        .em-3 { top: 35%; left: 3%; font-size: clamp(2rem, 5vw, 4.5rem); animation-duration: 14s; animation-delay: -5s; } /* Okul/Otobüs */
        .em-4 { top: 40%; right: 3%; font-size: clamp(3.5rem, 8vw, 6.5rem); animation-duration: 18s; animation-delay: -3s; } /* Kahvaltı/Yemek */
        .em-5 { top: 75%; left: 5%; font-size: clamp(3rem, 7vw, 5.5rem); animation-duration: 13s; animation-delay: -7s; } /* Kitap/Ders */
        .em-6 { top: 72%; right: 6%; font-size: clamp(2.5rem, 6vw, 4.5rem); animation-duration: 16s; animation-delay: -1s; } /* Spor/Top */
        .em-7 { top: 18%; left: 15%; font-size: clamp(1.8rem, 4vw, 3.5rem); animation-duration: 11s; animation-delay: -4s; } /* Diş fırçalama/Temizlik */
        .em-8 { top: 22%; right: 12%; font-size: clamp(2rem, 5vw, 4rem); animation-duration: 17s; animation-delay: -6s; } /* Çay/Kahve */
        .em-9 { top: 88%; left: 18%; font-size: clamp(1.8rem, 4vw, 3.5rem); animation-duration: 14s; animation-delay: -2s; } /* TV/Oyun */
        .em-10 { top: 85%; right: 20%; font-size: clamp(2.5rem, 6vw, 5rem); animation-duration: 19s; animation-delay: -8s; } /* Yatak/Uyku */
        .em-11 { top: 4%; left: 28%; font-size: clamp(3rem, 7vw, 5.5rem); animation-duration: 15s; animation-delay: -3s; } /* Ay/Gece */
        .em-12 { top: 5%; right: 30%; font-size: clamp(2rem, 5vw, 4.5rem); animation-duration: 12s; animation-delay: -9s; } /* Duş/Su */

        .main-container {
            width: 100%;
            max-width: 1050px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(8px, 3.5vh, 34px);
            z-index: 10;
        }

        .header { 
            text-align: center; 
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: clamp(10px, 2.7vh, 26px) clamp(15px, 6vw, 60px);
            border-radius: clamp(22px, 4vh, 36px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 700px;
            position: relative;
        }

        /* --- BÜYÜTÜLMÜŞ ÜNİTE ROZETİ --- */
        .unit-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--secondary), #e67e22);
            color: white;
            padding: clamp(3px, 0.8vh, 7px) clamp(14px, 3.2vw, 28px);
            border-radius: 999px;
            font-size: clamp(0.8rem, 2.5vh, 1.3rem);
            font-weight: normal;
            margin-bottom: clamp(5px, 1.5vh, 14px);
            box-shadow: 0 4px 15px rgba(211, 84, 0, 0.35);
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .header h1 { 
            font-size: clamp(1.35rem, min(6.6vw, 6.2vh), 3.6rem);
            color: var(--primary); 
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .header p { 
            color: var(--text-main); 
            font-size: clamp(0.9rem, 4vw, 1.6rem); 
            opacity: 0.8;
        }

        /* Kartlar İçin Agresif Esnek Izgara */
        .grid-container {
            display: flex;
            flex-wrap: wrap; 
            justify-content: center; 
            align-items: stretch;
            width: 100%;
            gap: clamp(7px, 2.4vh, 22px);
        }

        .game-card {
            position: relative;
            overflow: hidden; 
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 1);
            border-radius: clamp(16px, 3vh, 28px);
            padding: clamp(8px, 2.3vh, 20px) clamp(8px, 2vw, 18px);
            text-align: center;
            text-decoration: none; 
            color: var(--primary); 
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.03);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            flex: 1 1 calc(25% - 25px);
            max-width: 320px;
            min-width: clamp(120px, 22%, 220px); /* 4 kart yan yana sığabilmesi için küçültüldü */
            min-height: clamp(74px, 20.8vh, 190px);
            z-index: 1;
        }

        .game-card::before {
            content: attr(data-num);
            position: absolute;
            bottom: -5%;
            left: 2%; 
            font-size: clamp(2.6rem, 9vh, 8rem);
            font-family: 'Georgia', 'Times New Roman', serif;
            font-style: italic;
            font-weight: 400;
            background: linear-gradient(135deg, rgba(44, 62, 80, 0.08), rgba(44, 62, 80, 0.01));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: -1; 
            line-height: 0.8;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .game-card:hover { 
            transform: translateY(-10px) scale(1.02); 
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 15px 40px rgba(41, 128, 185, 0.15);
            border-color: rgba(41, 128, 185, 0.4);
        }

        .game-card:hover::before {
            transform: translateY(-15px) scale(1.05) rotate(-5deg);
            background: linear-gradient(135deg, rgba(41, 128, 185, 0.2), rgba(41, 128, 185, 0.05));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .icon-circle {
            width: clamp(34px, 9.9vh, 80px);
            height: clamp(34px, 9.9vh, 80px);
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.5));
            border: 2px solid rgba(255,255,255,1);
            border-radius: clamp(11px, 2.6vh, 22px);
            display: flex; 
            align-items: center;
            justify-content: center; 
            margin-bottom: clamp(4px, 1.5vh, 13px);
            font-size: clamp(1.15rem, 5.2vh, 2.9rem);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .game-card:hover .icon-circle {
            transform: scale(1.15) rotate(8deg);
            background: rgba(255, 255, 255, 1);
            border-color: var(--accent);
        }

        .game-card h2 { 
            font-size: clamp(0.8rem, min(3.6vh, 3.4vw), 1.9rem);
            font-weight: normal;
            line-height: 1.3;
        }

        /* MOBİL EKRANLAR */
        @media (max-width: 768px) {
            .game-card {
                flex-basis: calc(50% - 10px);
                min-height: clamp(66px, 13vh, 150px);
                padding: clamp(7px, 1.2vh, 16px) clamp(8px, 2.5vw, 16px);
            }
            .game-card::before {
                bottom: -8%;
            }
            .icon-circle {
                width: clamp(30px, 6.5vh, 62px);
                height: clamp(30px, 6.5vh, 62px);
                margin-bottom: clamp(3px, 1vh, 10px);
                font-size: clamp(1rem, 3.4vh, 2rem);
            }
            .game-card h2 { font-size: clamp(0.78rem, min(2.2vh, 4.5vw), 1.4rem); }
            .header { padding: clamp(8px, 1.8vh, 20px) clamp(12px, 5vw, 40px); }
            .unit-badge { margin-bottom: clamp(4px, 1.2vh, 11px); }
            .main-container { gap: clamp(7px, 2.5vh, 24px); }
            .grid-container { gap: clamp(6px, 1.6vh, 16px); }
            .quiz-card { min-height: clamp(58px, 13.5vh, 120px);
                         padding: clamp(7px, 1.4vh, 16px) clamp(12px, 4vw, 30px); }
            .quiz-ikon { width: clamp(40px, 11vh, 86px); height: clamp(40px, 11vh, 86px); }
        }

        /* ÇOK DAR EKRANLAR (400px altı) */
        @media (max-width: 400px) {
            .game-card {
                flex-basis: calc(50% - 5px);
                border-radius: 16px;
            }
            .icon-circle { border-radius: 12px; }
            .game-card::before {
                left: 5%;
                bottom: -12%;
                font-size: 3.2rem;
            }
            .grid-container { gap: 8px; }
        }
    
    
        /* ==================================================================
           OZEL KART - CANLI BILGI YARISMASI
           Diger kartlar cam beyazi ve emoji ikonlu; bu kart kasten farkli:
           kendi satirini bastan sona kaplar, koyu mor gradyan zemin ve altin
           cerceve kullanir, ikon yerine animasyonlu SVG kupa tasir.
           Tum animasyonlar salt gorseldir; en altta "hareketi azalt" sistem
           ayari icin kapatma blogu vardir.
           ================================================================== */
        .quiz-card {
            flex: 1 1 100%;
            max-width: 100%;
            min-width: 0;
            min-height: clamp(66px, 18.8vh, 158px);
            flex-direction: row;
            justify-content: center;
            gap: clamp(10px, 3.5vw, 34px);
            padding: clamp(8px, 2.1vh, 20px) clamp(14px, 4vw, 42px);
            background: linear-gradient(115deg, #221a4a 0%, #3a2a78 46%, #5c40a8 100%);
            border: 2px solid rgba(255, 214, 120, 0.5);
            box-shadow: 0 14px 40px rgba(50, 35, 110, 0.32);
            color: #fff;
            overflow: hidden;
        }

        /* Dev rakam: beyaz kartlarda gri, burada altin tonunda */
        .quiz-card::before {
            background: linear-gradient(135deg, rgba(255, 215, 120, 0.30), rgba(255, 215, 120, 0.03));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Kartin uzerinden yavasca gecen isik seridi */
        .quiz-card::after {
            content: "";
            position: absolute;
            top: -60%;
            bottom: -60%;
            width: 60px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent);
            transform: rotate(14deg);
            animation: quizSerit 6.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes quizSerit {
            0%        { left: -20%; opacity: 0; }
            12%       { opacity: 1; }
            55%       { opacity: 1; }
            70%, 100% { left: 110%; opacity: 0; }
        }

        .quiz-card:hover {
            background: linear-gradient(115deg, #2a1f5c 0%, #45318d 46%, #6c4cc4 100%);
            border-color: rgba(255, 214, 120, 0.95);
            box-shadow: 0 20px 50px rgba(50, 35, 110, 0.45);
        }

        .quiz-ikon {
            flex-shrink: 0;
            width: clamp(46px, 14vh, 112px);
            height: clamp(46px, 14vh, 112px);
            z-index: 1;
        }
        .quiz-ikon svg { width: 100%; height: 100%; display: block; overflow: visible; }

        .quiz-yazi {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(4px, 1vw, 9px);
            z-index: 1;
        }
        .quiz-card h2 {
            color: #fff;
            font-size: clamp(0.95rem, min(4.3vh, 4.2vw), 2.2rem);
            line-height: 1.25;
            text-shadow: 0 2px 10px rgba(0,0,0,0.25);
        }
        .quiz-alt {
            font-size: clamp(0.65rem, min(2.1vh, 2.4vw), 1.05rem);
            color: rgba(255, 231, 178, 0.9);
        }

        /* "Canli" rozeti: kirmizi nokta disa dogru nabiz atar */
        .quiz-rozet {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 214, 120, 0.45);
            border-radius: 999px;
            padding: 2px 12px 3px;
            font-size: clamp(0.6rem, min(1.9vh, 2.2vw), 0.95rem);
            color: #FFE7B2;
        }
        .quiz-nokta {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #FF5A5A;
            animation: quizNabiz 1.8s ease-out infinite;
        }
        @keyframes quizNabiz {
            0%   { box-shadow: 0 0 0 0 rgba(255, 90, 90, 0.75); }
            70%  { box-shadow: 0 0 0 9px rgba(255, 90, 90, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 90, 90, 0); }
        }

        /* --- "Iki telefon karekoda baglaniyor" hareketleri ---
           4 saniyelik dongu: karekod hafifce nefes alir, uzerinden turuncu
           tarama cizgisi gecer, iki telefondan altin noktalar kareye dogru
           akar, sonunda yesil onay halkasi ve tik belirir. */
        .q-qr { transform-box: fill-box; transform-origin: center;
                animation: qrNefes 4s ease-in-out infinite; }
        @keyframes qrNefes {
            0%, 100% { transform: scale(1); }
            44%      { transform: scale(1.06); }
            60%      { transform: scale(1); }
        }

        .q-tarama { animation: qrTara 4s cubic-bezier(.5, 0, .5, 1) infinite; }
        @keyframes qrTara {
            0%        { transform: translateY(-26px); opacity: 0; }
            10%       { opacity: 0.95; }
            42%       { transform: translateY(26px);  opacity: 0.95; }
            50%, 100% { transform: translateY(26px);  opacity: 0; }
        }

        .q-halka { transform-box: fill-box; transform-origin: center;
                   animation: qrHalka 4s ease-out infinite; }
        @keyframes qrHalka {
            0%, 46%   { opacity: 0;    transform: scale(0.7); }
            56%       { opacity: 0.85; }
            82%, 100% { opacity: 0;    transform: scale(1.25); }
        }

        .q-onay { transform-box: fill-box; transform-origin: center;
                  animation: qrOnay 4s ease-out infinite; }
        @keyframes qrOnay {
            0%, 48%  { opacity: 0; transform: scale(0.4); }
            58%      { opacity: 1; transform: scale(1.12); }
            66%, 86% { opacity: 1; transform: scale(1); }
            100%     { opacity: 0; transform: scale(1); }
        }

        /* telefonlar yavasca nefes alir gibi inip kalkar */
        .q-tel   { animation: qrTelSalin 4s ease-in-out infinite; }
        .q-tel-b { animation-delay: 0.55s; }
        @keyframes qrTelSalin {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-3px); }
        }

        /* telefondan kareye akan veri noktalari */
        .q-nok { opacity: 0; }
        .q-ns  { animation: qrAkisSol 2s ease-in-out infinite; }
        .q-ng  { animation: qrAkisSag 2s ease-in-out infinite; }
        .q-n2  { animation-delay: 0.4s; }
        .q-n3  { animation-delay: 0.8s; }
        @keyframes qrAkisSol {
            0%   { transform: translate(0, 0);       opacity: 0; }
            18%  { opacity: 1; }
            72%  { opacity: 1; }
            100% { transform: translate(10px, -7px); opacity: 0; }
        }
        @keyframes qrAkisSag {
            0%   { transform: translate(0, 0);        opacity: 0; }
            18%  { opacity: 1; }
            72%  { opacity: 1; }
            100% { transform: translate(-10px, -7px); opacity: 0; }
        }

        /* kesikli baglanti izi kareye dogru kayar */
        .q-iz { animation: qrIz 1.6s linear infinite; }
        @keyframes qrIz { to { stroke-dashoffset: -12; } }

        @media (max-width: 400px) {
            .quiz-card {
                gap: 10px;
                padding: 8px 12px;
                min-height: clamp(58px, 12vh, 100px);
            }
            .quiz-card h2 { font-size: clamp(0.9rem, 2.6vh, 1.15rem); }
        }

        /* Cok basik ekranlar (yatay tutulan telefon): sekiz kart yine de
           tek ekrana sigsin diye butun dikey olculer bir kademe daha kisilir.
           Diger sorgulardan sonra geldigi icin sira geregi ustun gelir. */
        @media (max-height: 470px) {
            body { padding: 1vh 2vw; }
            .main-container { gap: clamp(6px, 2vh, 16px); }
            .header { padding: clamp(6px, 1.6vh, 14px) clamp(12px, 5vw, 40px); }
            .unit-badge {
                font-size: clamp(0.7rem, 2.2vh, 1rem);
                margin-bottom: clamp(3px, 1vh, 8px);
            }
            .header h1 { font-size: clamp(1.1rem, min(5vw, 5.4vh), 2rem); }
            .game-card {
                min-height: clamp(58px, 18vh, 90px);
                padding: clamp(5px, 1.6vh, 12px) clamp(6px, 1.6vw, 12px);
            }
            .icon-circle {
                width: clamp(26px, 8vh, 44px);
                height: clamp(26px, 8vh, 44px);
                margin-bottom: clamp(2px, 1vh, 6px);
                font-size: clamp(0.9rem, 4.4vh, 1.6rem);
            }
            .game-card h2 { font-size: clamp(0.72rem, min(3.2vh, 3vw), 1.1rem); }
            .game-card::before { font-size: clamp(2rem, 7vh, 4rem); }
            .grid-container { gap: clamp(5px, 1.8vh, 12px); }
            .quiz-card {
                min-height: clamp(50px, 16vh, 84px);
                padding: clamp(5px, 1.5vh, 12px) clamp(10px, 3vw, 26px);
            }
            .quiz-ikon { width: clamp(34px, 12vh, 66px); height: clamp(34px, 12vh, 66px); }
        }

        /* Kullanici sistem ayarinda hareketi azaltmissa kart sabit dursun */
        @media (prefers-reduced-motion: reduce) {
            .quiz-card::after, .quiz-nokta, .q-qr, .q-tarama, .q-halka,
            .q-onay, .q-tel, .q-nok, .q-iz { animation: none; }
            .q-tarama { opacity: 0; }
            .q-halka  { opacity: 0.45; transform: none; }
            .q-onay   { opacity: 1;    transform: none; }
            .q-nok    { opacity: 0.9;  transform: none; }
        }

</style>

    

    
</head>
